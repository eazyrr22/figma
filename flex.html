<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: white;
        display: flex;
        justify-content: center;
      }
      main {
        background-color: black;
        border: 2px solid;
        border-radius: 35px;
        margin-bottom: 20px;
        height: 480px;
        width: fit-content;
        display: flex;
        flex-direction: column;
        justify-content: end;
        align-items: end;
        line-height: 50px;
        gap: 10px;
      }
      #btn{
        /* margin-bottom: 20px ; */
        margin-bottom: 20px;
        width: fit-content;
        display: flex;
        flex-direction: column;
        justify-content: end;
        align-items: end;
        line-height: 50px;
        gap: 10px;
      }

      .box {
        background-color: green;
        margin-bottom: 20px;
        border-radius: 30px;
        margin: 10px;
        border: 20px;
        height: 48px;
        width: 230px;
        text-align: center;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <aside id="btn">
        <div class="box">begginer</div>
        <div class="box">advanced</div>
        <div class="box">pro</div>
      </aside>
    </main>
  </body>
</html>
